<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息统计</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="top-menu">
        <button onclick="handleButtonClick(this)">收码详情</button>
        <button onclick="handleButtonClick(this)">吃码详情</button>
        <button onclick="openModal('recognize')">接单识别文本</button>
        <button onclick="handleSummary()">订单汇总</button>
        <button onclick="copyClientData()">复制客户订单</button>
        <button onclick="clearUserData()">清空数据</button>
        <button onclick="handleButtonClick(this)">对奖</button>
        <button onclick="handleButtonClick(this)">关于软件</button>
    </div>

    <div class="main-content">
        <div class="user-list">
            <h3>用户列表</h3>
            <input type="text" id="newUserName" placeholder="输入新用户名">
            <button onclick="addUser()">添加用户</button>
            <ul id="userList"></ul>
        </div>

        <div class="left-side">
            <h3 id="currentUser">当前用户: 无</h3>
            <div class="title">散码汇总</div>
            <div class="section" id="section1"></div>

            <div class="title">汇总</div>
            <div class="section" id="section2"></div>
        </div>

        <div class="right-side">
            <h2 id="sortedResultsTitle">所有用户累计值排序：</h2>
            <ul id="sortedResults"></ul>

            <div class="original-data">
                <h3 id="originalDataTitle">原始输入数据：</h3>
                <ul id="originalDataList"></ul>
            </div>
        </div>
    </div>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">粘贴消息进行识别</h2>
            <textarea id="message" rows="4" cols="50" placeholder="输入消息，例如: 14.21.13.39.38.30.26.18.33～各20"></textarea>
            <button class="recognize-button" onclick="previewMessage()">识别</button>
            <pre id="result"></pre>
            <button class="confirm-button" onclick="confirmEdit()">确认</button>
            <button class="cancel-button" onclick="closeModal()">取消</button>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2 id="editModalTitle"></h2>
            <div id="editModalContent"></div>
        </div>
    </div>

    <!-- 输入框和显示内容的容器 -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 20px;">
        <input type="text" id="inputField" />
        <div id="display" style="border: 1px solid #000; padding: 10px; min-height: 20px; width: 200px;"></div>
    </div>
    

    <script src="./renderer.js"></script>

</body>
</html>
