<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息统计</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="top-menu">
        <button class="selected" onclick="handleButtonClick(this)">接单I</button>
        <button onclick="handleButtonClick(this)">吃码上报C</button>
        <button onclick="handleButtonClick(this)">操作详单</button>
        <button onclick="handleButtonClick(this, 'copy')">复制客户清单</button>
        <button onclick="clearUserData()">清空数据</button>
        <button onclick="handleButtonClick(this)">系统设置</button>
        <button onclick="handleButtonClick(this)">对奖</button>
        <button onclick="handleButtonClick(this)">页网上报</button>
        <button onclick="handleSummary()">汇总</button>
        <button onclick="openModal('recognize')">识别文本</button>
    </div>

    <div class="main-content">
        <div class="user-list">
            <h3>用户列表</h3>
            <input type="text" id="newUserName" placeholder="输入新用户名">
            <button onclick="addUser()">添加用户</button>
            <ul id="userList"></ul>
        </div>

        <div class="left-side">
            <h3 id="currentUser">当前用户: 无</h3>
            <div class="title">散码汇总</div>
            <div class="section" id="section1"></div>

            <div class="title">汇总</div>
            <div class="section" id="section2"></div>
        </div>

        <div class="right-side">
            <h2 id="sortedResultsTitle">所有用户累计值排序：</h2>
            <ul id="sortedResults"></ul>

            <div class="original-data">
                <h3 id="originalDataTitle">原始输入数据：</h3>
                <ul id="originalDataList"></ul>
            </div>
        </div>
    </div>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">编辑数值</h3>
            <div id="modalContent"></div>
            <button onclick="confirmEdit()">确认</button>
            <button onclick="closeModal()">取消</button>
        </div>
    </div>

    <script src="./renderer.js"></script>
</body>
</html>
