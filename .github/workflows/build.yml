name: Build Electron App

on:
  push:
    branches:
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bundled AI model assets
        shell: bash
        run: |
          set -euo pipefail
          model_dir="assets/ai/models/Mozilla/Qwen2.5-0.5B-Instruct/onnx"
          mkdir -p "$model_dir"
          curl -L --fail --retry 3 -o "$model_dir/model_q4f16.onnx" \
            "https://huggingface.co/Mozilla/Qwen2.5-0.5B-Instruct/resolve/main/onnx/model_q4f16.onnx"
          curl -L --fail --retry 3 -o "$model_dir/model_q4f16.onnx_data" \
            "https://huggingface.co/Mozilla/Qwen2.5-0.5B-Instruct/resolve/main/onnx/model_q4f16.onnx_data"

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis --publish never

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg --publish never
