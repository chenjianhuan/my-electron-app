name: Release macOS Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach macOS assets to
        required: true
        default: v6.1.6
  push:
    tags:
      - "mac-v*"

permissions:
  contents: write

jobs:
  build_macos:
    runs-on: macos-latest

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME#mac-}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Restore bundled AI model assets
        shell: bash
        run: |
          set -euo pipefail
          model_dir="assets/ai/models/Mozilla/Qwen2.5-0.5B-Instruct/onnx"
          mkdir -p "$model_dir"
          curl -L --fail --retry 3 -o "$model_dir/model_q4f16.onnx" \
            "https://huggingface.co/Mozilla/Qwen2.5-0.5B-Instruct/resolve/main/onnx/model_q4f16.onnx"
          curl -L --fail --retry 3 -o "$model_dir/model_q4f16.onnx_data" \
            "https://huggingface.co/Mozilla/Qwen2.5-0.5B-Instruct/resolve/main/onnx/model_q4f16.onnx_data"

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build macOS arm64
        run: node scripts/run-electron-builder.js --with-ai-models --mac dmg zip --arm64 --publish never

      - name: Publish macOS assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
