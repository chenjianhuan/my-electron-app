name: Release Electron App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore bundled AI model assets
        shell: bash
        run: |
          set -euo pipefail
          model_dir="assets/ai/models/Mozilla/Qwen2.5-0.5B-Instruct/onnx"
          mkdir -p "$model_dir"
          curl -L --fail --retry 3 -o "$model_dir/model_q4f16.onnx" \
            "https://huggingface.co/Mozilla/Qwen2.5-0.5B-Instruct/resolve/main/onnx/model_q4f16.onnx"
          curl -L --fail --retry 3 -o "$model_dir/model_q4f16.onnx_data" \
            "https://huggingface.co/Mozilla/Qwen2.5-0.5B-Instruct/resolve/main/onnx/model_q4f16.onnx_data"

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: node scripts/run-electron-builder.js --with-ai-models --win nsis --publish never

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: node scripts/run-electron-builder.js --with-ai-models --mac dmg zip --publish never

      - name: Publish Windows assets
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish macOS assets
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
